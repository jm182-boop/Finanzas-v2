<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fin. - Finanzas Personales</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="toast"></div>

  <div id="auth-screen" class="auth-wrap">
    <div class="auth-box">
      <h1 class="logo">fin.</h1>
      <h2 id="auth-title">Iniciar Sesión</h2>
      <input type="email" id="a-email" class="in" placeholder="Tu correo electrónico">
      <input type="password" id="a-pwd" class="in" placeholder="Tu contraseña">
      <button class="btn" id="auth-btn" onclick="doAuth()">Entrar</button>
      <div class="auth-switch" id="auth-toggle" onclick="toggleAuth()">¿No tienes cuenta? <span>Regístrate</span></div>
    </div>
  </div>

  <div id="app" style="display:none;">
    
    <div class="sidebar">
      <div>
        <div class="logo">fin.</div>
        <div class="uemail" id="uemail"></div>
      </div>
      <div class="nav">
        <button class="nb active" onclick="sp('resumen', this)">Resumen</button>
        <button class="nb" onclick="sp('historial', this)">Movimientos</button>
        <button class="nb" onclick="sp('ahorros', this)">Ahorro e Inversión</button>
        <button class="nb" onclick="sp('prestamos', this)">Compartidos & Préstamos</button>
        <button class="nb" onclick="sp('config', this)">Configuración (Sobres)</button>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn-icon" onclick="toggleTheme()">
          <span id="icon-dark">🌙</span><span id="icon-light" style="display:none">☀️</span>
        </button>
        <button class="btn-icon" onclick="logout()" style="flex:1">Salir</button>
      </div>
    </div>

    <div class="main-content">
      
      <div id="page-resumen" class="page active">
        <div class="header">
          <button class="btn-icon" onclick="changeMonth(-1)">‹</button>
          <h2 id="mlabel">Mes</h2>
          <button class="btn-icon" onclick="changeMonth(1)">›</button>
        </div>
        <div id="resumen-content"></div>
      </div>

      <div id="page-historial" class="page">
        <div class="header"><h2 id="mlabel2">Mes</h2></div>
        
        <div class="card" style="margin-bottom:20px;">
          <div class="tabs">
            <button id="btg" class="tb ag" onclick="setTipo('gasto')">Gasto</button>
            <button id="bti" class="tb" onclick="setTipo('ingreso')">Ingreso</button>
          </div>
          <input type="text" id="gdesc" class="in" placeholder="Ej: Supermercado, Sueldo...">
          <input type="text" id="gmonto" class="in" placeholder="Monto total ($)" onkeyup="fmtI(this)" onchange="calcCuota()">
          
          <div id="campos-gasto">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <select id="gcat" class="in"></select> 
              <input type="date" id="gfecha" class="in">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
              <input type="text" id="gcuotas" class="in" placeholder="Total cuotas (Opcional)" onkeyup="fmtI(this)" onchange="calcCuota()">
              <input type="text" id="gcuota-num" class="in" placeholder="N° Cuota actual" onkeyup="fmtI(this)">
            </div>
          </div>
          
          <div id="campos-ingreso" style="display:none;">
            <input type="date" id="gfechai" class="in">
          </div>
          
          <input type="text" id="gnota" class="in" placeholder="Notas adicionales (Opcional)..." style="margin-top:10px;">
          <button class="btn" id="btnagregar" onclick="agregarMov()" style="margin-top:15px;">Guardar gasto</button>
        </div>

        <div class="card" style="height:200px;margin-bottom:20px;"><canvas id="hist-chart"></canvas></div>
        <div id="historial-content"></div>
      </div>

      <div id="page-ahorros" class="page">
        <div id="ahero"></div>
        <div class="card" style="margin:20px 0;">
          <div class="tabs">
            <button id="cht-tot" class="tb" style="border-color:var(--accent);color:var(--accent2)" onclick="setChartMode('total', this)">Total</button>
            <button id="cht-des" class="tb" onclick="setChartMode('billetera', this)">Por billetera</button>
          </div>
          <div style="height:200px;margin-top:15px;"><canvas id="achrt"></canvas></div>
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 2fr;gap:20px;">
          <div>
            <div class="card" style="margin-bottom:20px;">
              <div class="ct">Por billetera</div>
              <div id="bill-list"></div>
            </div>
            <div class="card">
              <div class="ct">Registrar Depósito</div>
              <input type="text" id="amonto" class="in" placeholder="Monto ($)" onkeyup="fmtI(this)">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <select id="abilletera" class="in"></select>
                <input type="date" id="afecha" class="in">
              </div>
              <input type="text" id="anota" class="in" placeholder="Ej: Compra de MEP, Plazo Fijo...">
              <button class="btn" id="btnahorro" onclick="agregarAhorro()" style="margin-top:15px;">Guardar depósito</button>
            </div>
          </div>
          <div class="card">
            <div class="ct">Historial</div>
            <div id="ahist"></div>
          </div>
        </div>
      </div>

      <div id="page-prestamos" class="page">
        <div class="header"><h2>Compartidos y Préstamos</h2></div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
          
          <div class="card">
            <div class="ct">Nuevo Gasto Compartido (Reintegro)</div>
            <input type="text" id="cdesc" class="in" placeholder="Ej: Prótesis mamá, Regalo...">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
                <input type="text" id="cmonto" class="in" placeholder="Costo Total ($)" onkeyup="fmtI(this)">
                <input type="number" id="cporcentaje" class="in" placeholder="Tu parte (%) - Ej: 50">
            </div>
            <input type="text" id="cdeudor" class="in" placeholder="¿Quién te debe el resto? (Ej: Mi hermano)" style="margin-top:10px;">
            <button class="btn" id="btn-comp" onclick="agregarCompartido()" style="margin-top:15px;">Guardar y calcular reintegro</button>
            <div id="lista-compartidos" style="margin-top:25px;"></div>
          </div>

          <div class="card">
            <div class="ct">Nuevo Préstamo de Dinero</div>
            <input type="text" id="pdesc" class="in" placeholder="Motivo del préstamo...">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
                <input type="text" id="pmonto" class="in" placeholder="Monto prestado ($)" onkeyup="fmtI(this)">
                <input type="date" id="pfecha" class="in">
            </div>
            <input type="text" id="ppersona" class="in" placeholder="¿A quién le prestaste?" style="margin-top:10px;">
            <button class="btn" id="btn-prestamo" onclick="agregarPrestamo()" style="margin-top:15px;">Registrar Préstamo</button>
            <div id="lista-prestamos" style="margin-top:25px;"></div>
          </div>
        </div>
      </div>

      <div id="page-config" class="page">
        <div class="header"><h2>Configuración y Estructura</h2></div>
        
        <div class="card" style="margin-bottom:20px;">
          <div class="ct">Reglas y Parámetros Base</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;">
            <div><label style="font-size:12px;color:var(--text3)">Sueldo Base ($)</label><input type="text" id="cfg-sueldo" class="in" onkeyup="fmtI(this)"></div>
            <div><label style="font-size:12px;color:var(--text3)">Regla (%) Nec/Des/Aho</label><input type="text" id="cfg-regla" class="in" placeholder="Ej: 50/30/20"></div>
            <div><label style="font-size:12px;color:var(--text3)">Nombres (Tú / Pareja)</label><input type="text" id="cfg-nombres" class="in" placeholder="Ej: Yo / Sofi"></div>
          </div>
          <button class="btn" onclick="guardarCfg()" style="margin-top:15px;width:auto;padding:0 20px;">Guardar Parámetros</button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
          
          <div class="card">
            <div class="ct">Tus Sobres (Presupuestos)</div>
            <input type="text" id="sob-nombre" class="in" placeholder="Nombre (Ej: Supermercado)">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
              <select id="sob-bucket" class="in">
                <option value="necesidades">Necesidad</option>
                <option value="deseos">Deseo</option>
                <option value="ahorro">Ahorro / Extra</option>
              </select>
              <input type="text" id="sob-limite" class="in" placeholder="Tope mensual ($)" onkeyup="fmtI(this)">
            </div>
            <button class="btn" onclick="agregarSobre()" style="margin-top:15px;">Crear Sobre</button>
            <div id="lista-sobres" style="margin-top:25px;"></div>
          </div>

          <div class="card">
            <div class="ct">Tus Billeteras</div>
            <div style="display:grid;grid-template-columns:1fr 50px;gap:10px;">
              <input type="text" id="bill-nombre" class="in" placeholder="Nombre (Ej: Binance, Lemon...)">
              <input type="color" id="bill-color" class="in" style="padding:0;height:42px;width:100%;cursor:pointer;border:none;border-radius:8px;" value="#f59e0b">
            </div>
            <button class="btn" onclick="agregarBilletera()" style="margin-top:15px;">Crear Billetera</button>
            <div id="lista-billeteras" style="margin-top:25px;"></div>
          </div>

        </div>
      </div>

    </div>
    
    <div id="chat-widget">
      <div id="chat-msgs"></div>
      <div style="display:flex;gap:8px;padding:12px;background:var(--bg2);border-top:1px solid var(--border)">
        <input type="text" id="cinput" placeholder="Pregúntale a Gemini..." onkeypress="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 15px;cursor:pointer">➔</button>
      </div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="supabase-client.js"></script>
  <script src="gemini.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
