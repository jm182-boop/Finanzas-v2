<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>fin. - Finanzas Personales</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
  <div id="toast"></div>

  <div id="auth-screen" class="auth-wrap">
    <div class="auth-box">
      <h1 class="logo">fin.</h1>
      <h2 id="auth-title">Iniciar Sesión</h2>
      
      <input type="email" id="a-email" class="in" placeholder="Tu correo electrónico">
      
      <div style="position: relative; margin-bottom: 15px;">
        <input type="password" id="a-pwd" class="in" placeholder="Tu contraseña" style="padding-right: 45px; margin-bottom: 0;">
        <button type="button" class="btn-eye" onclick="togglePwd()">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      
      <div style="text-align: right; margin-top: -5px; margin-bottom: 15px;">
        <span class="auth-forgot" onclick="recuperarPwd()">¿Olvidaste tu contraseña?</span>
      </div>

      <button class="btn" id="auth-btn" onclick="doAuth()">Entrar</button>
      <div class="auth-switch" id="auth-toggle" onclick="toggleAuth()">¿No tienes cuenta? <span>Regístrate</span></div>
    </div>
  </div>

  <div id="app" style="display:none;">
    
    <div class="sidebar">
      <div>
        <div class="logo">fin.</div>
        <div class="uemail" id="uemail"></div>
      </div>
      <div class="nav">
        <button class="nb active" onclick="sp('resumen', this)">Resumen</button>
        <button class="nb" onclick="sp('historial', this)">Movimientos</button>
        <button class="nb" onclick="sp('ahorros', this)">Ahorros</button>
        <button class="nb" onclick="sp('prestamos', this)">Préstamos</button>
        <button class="nb" onclick="sp('config', this)">Config</button>
        <button class="nb" onclick="sp('ia', this)">Asistente IA</button>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn-icon" onclick="toggleTheme()"><span id="icon-dark">🌙</span><span id="icon-light" style="display:none">☀️</span></button>
        <button class="btn-icon" onclick="logout()" style="flex:1">Salir</button>
      </div>
    </div>
