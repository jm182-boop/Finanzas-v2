<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fin. - Finanzas Personales</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="toast"></div>

  <div id="auth-screen" class="auth-wrap">
    <div class="auth-box">
      <h1 class="logo">fin.</h1>
      <h2 id="auth-title">Iniciar Sesión</h2>
      
      <input type="email" id="a-email" class="in" placeholder="Tu correo electrónico">
      
      <div style="position: relative;">
        <input type="password" id="a-pwd" class="in" placeholder="Tu contraseña" style="padding-right: 40px;">
        <button type="button" class="btn-eye" onclick="togglePwd()">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      
      <div style="text-align: right; margin-top: -5px; margin-bottom: 15px;">
        <span class="auth-forgot" onclick="recuperarPwd()">¿Olvidaste tu contraseña?</span>
      </div>

      <button class="btn" id="auth-btn" onclick="doAuth()">Entrar</button>
      <div class="auth-switch" id="auth-toggle" onclick="toggleAuth()">¿No tienes cuenta? <span>Regístrate</span></div>
    </div>
  </div>

  <div id="app" style="display:none;">
    
    <div class="sidebar">
      <div>
        <div class="logo">fin.</div>
        <div class="uemail" id="uemail"></div>
      </div>
      <div class="nav">
        <button class="nb active" onclick="sp('resumen', this)">Resumen</button>
        <button class="nb" onclick="sp('historial', this)">Movimientos</button>
        <button class="nb" onclick="sp('ahorros', this)">Ahorros</button>
        <button class="nb" onclick="sp('prestamos', this)">Préstamos</button>
        <button class="nb" onclick="sp('config', this)">Config</button>
        <button class="nb" onclick="sp('ia', this)">Asistente IA</button>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn-icon" onclick="toggleTheme()"><span id="icon-dark">🌙</span><span id="icon-light" style="display:none">☀️</span></button>
        <button class="btn-icon" onclick="logout()" style="flex:1">Salir</button>
      </div>
    </div>

    <div class="main-content">
      
      <div id="page-resumen" class="page active">
        <div class="header">
          <button class="btn-icon" onclick="changeMonth(-1)">‹</button>
          <h2 id="mlabel">Mes</h2>
          <button class="btn-icon" onclick="changeMonth(1)">›</button>
        </div>
        <div class="mg">
          <div class="met"><div class="ml">Ingresos</div><div class="mv" id="r-ingresos">$0</div></div>
          <div class="met"><div class="ml">Gastado</div><div class="mv bad" id="r-gastos">$0</div></div>
          <div class="met"><div class="ml">Disponible</div><div class="mv ok" id="r-disponible">$0</div></div>
        </div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;" class="resumen-grid">
          <div class="card" id="resumen-barras">
            </div>
          
          <div style="display:flex;flex-direction:column;gap:20px;">
            <div class="card" id="resumen-checklist">
               <div class="ct">Checklist de Pagos</div>
               <div id="lista-checklist"></div>
            </div>
            <div class="card" id="resumen-tarjetas">
               <div class="ct">Por Tarjeta / Billetera</div>
               <div id="lista-tarjetas"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="page-historial" class="page">
        <div class="header"><h2 id="mlabel2">Mes</h2></div>
        
        <div class="card" style="margin-bottom:20px;">
          <div class="tabs">
            <button id="btg" class="tb active b-rojo" onclick="setTipo('gasto')">Gasto</button>
            <button id="bti" class="tb b-verde" onclick="setTipo('ingreso')">Ingreso</button>
          </div>
          
          <input type="text" id="gdesc" class="in" placeholder="Descripción (Ej: Supermercado, Sueldo...)">
          <input type="text" id="gmonto" class="in" placeholder="Monto total ($) - Ej: 1500,50" onkeyup="fmtI(this)">
          
          <div id="campos-gasto">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <select id="gcat" class="in">
                <option value="">Selecciona Billetera/Tarjeta</option>
              </select> 
              <input type="date" id="gfecha" class="in">
            </div>
            
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
              <input type="text" id="gcuotas" class="in" placeholder="Total cuotas (Opcional)" onkeyup="fmtI(this)">
              <input type="text" id="gcuota-num" class="in" placeholder="N° Cuota actual (Opcional)" onkeyup="fmtI(this)">
            </div>

            <label style="display:flex;align-items:center;gap:8px;margin-top:15px;font-size:13px;cursor:pointer;">
              <input type="checkbox" id="chk-compartido" onchange="toggleCompartido()">
              Marcar como Gasto Compartido (Reintegro)
            </label>
            
            <div id="caja-compartido" style="display:none;background:var
